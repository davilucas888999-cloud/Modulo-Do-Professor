<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão Escolar | EM Dr. Custódio de Paula Rodrigues</title>
<style>
:root{--blue:#2B4E80;--blue2:#203e68;--bg:#f3f5f8;--field:#e9edf2;--line:#d7dee8;--text:#263445;--muted:#66758a;--white:#fff;--danger:#b42318;--green:#18794e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:700}button:hover{background:var(--blue2)}button.secondary{background:#e5eaf1;color:var(--blue)}button.danger{background:#b42318}button.small{padding:6px 9px;font-size:12px}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:5}.brand{padding:0 10px 22px;border-bottom:1px solid var(--line);margin-bottom:15px}.brand strong{display:block;color:var(--blue);font-size:16px;line-height:1.35}.brand small{color:var(--muted)}.nav button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:transparent;color:#46566b;margin:3px 0;padding:11px 12px;font-weight:600}.nav button.active,.nav button:hover{background:#eaf0f8;color:var(--blue)}.nav .ico{width:20px;text-align:center;font-size:16px}.main{margin-left:245px;width:calc(100% - 245px);padding:26px 30px 95px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h1{font-size:24px;margin:0;color:#1e3048}.top p{margin:4px 0 0;color:var(--muted)}.year-tag{background:#e6edf6;color:var(--blue);padding:8px 12px;border-radius:8px;font-weight:bold}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 16px;color:#243b59}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-weight:700;color:#4b5b70;font-size:12px}.field input,.field select,.field textarea,input.cell,select.cell{width:100%;background:var(--field);border:1px solid #dce2ea;border-radius:7px;padding:9px 10px;color:var(--text);min-width:0}.field textarea{min-height:80px;resize:vertical}.field input:disabled,.field select:disabled,input:disabled{background:#dce1e8;color:#526174;opacity:1}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;background:#fff;min-width:650px}th,td{padding:10px 9px;border-bottom:1px solid #e4e8ee;text-align:left;vertical-align:top}th{background:#edf1f6;color:#34465e;font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:0}td.center,th.center{text-align:center}.empty{padding:25px;text-align:center;color:var(--muted)}.muted{color:var(--muted)}.subline{display:block;font-size:11px;color:#66758a;margin-top:4px}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.check{width:18px;height:18px;accent-color:var(--blue);vertical-align:middle}.fixed-save{position:fixed;bottom:0;left:245px;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 30px;display:flex;justify-content:flex-end;z-index:4}.notice{padding:12px 14px;border-radius:8px;background:#edf3fa;color:#345477;margin:10px 0}.notice.warn{background:#fff4e5;color:#875500}.notice.good{background:#e8f5ee;color:#17633f}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#f5f7fa;border:1px solid var(--line);padding:17px;border-radius:9px}.stat b{display:block;font-size:25px;color:var(--blue)}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:15px}.toolbar .field{min-width:150px}.activity{padding:8px;border:1px solid #e0e5ec;border-radius:7px;margin-bottom:7px;min-width:180px}.activity strong{display:block;font-size:12px;margin-bottom:6px}.activity label{font-size:11px;color:var(--muted);display:block;margin:4px 0}.activity input{width:72px;padding:5px;background:var(--field);border:1px solid var(--line);border-radius:5px}.official{text-align:center;font-weight:800;min-width:90px}.official span{display:block;font-size:11px;letter-spacing:.3px}.official b{font-size:22px}.dayrow{display:flex;align-items:center;gap:12px;padding:9px;border-bottom:1px solid #edf0f4}.dayrow:last-child{border:0}.dayrow .date{width:105px;font-weight:bold}.dayrow .weekday{width:130px;color:var(--muted)}.mobile-head{display:none}.loading{position:fixed;inset:0;background:#ffffffd9;display:none;align-items:center;justify-content:center;z-index:20;font-size:18px;font-weight:bold;color:var(--blue)}.spinner{width:25px;height:25px;border:3px solid #d6dfeb;border-top-color:var(--blue);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;margin-right:10px}@keyframes spin{to{transform:rotate(360deg)}}.report{max-width:950px;margin:auto;background:white;padding:25px;border:1px solid #cfd6df}.report h2,.report h3{text-align:center;margin:5px}.report .report-sub{text-align:center;font-size:11px}.report table{min-width:0}.report th,.report td{padding:6px;font-size:11px}.signatures{display:flex;justify-content:space-around;gap:25px;margin-top:55px;text-align:center}.signatures div{border-top:1px solid #333;width:40%;padding-top:6px}.hidden{display:none!important}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#eaf0f8;color:var(--blue);font-size:11px;font-weight:bold}
@media(max-width:900px){.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px);padding:20px}.fixed-save{left:210px}.grid{grid-template-columns:repeat(2,minmax(140px,1fr))}}
@media(max-width:650px){.app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:3px 8px 10px;margin-bottom:8px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto;margin:0;padding:9px}.nav .ico{display:none}.main{margin:0;width:100%;padding:17px 12px 90px}.top{align-items:flex-start}.top h1{font-size:20px}.grid{grid-template-columns:1fr 1fr}.statgrid{grid-template-columns:1fr}.fixed-save{left:0;padding:10px 14px}.panel{padding:14px}.dayrow{gap:7px;flex-wrap:wrap}.dayrow .date,.dayrow .weekday{width:auto}.report{padding:10px}.report table{font-size:9px}.signatures{margin-top:35px}}
@media print{body{background:#fff}.sidebar,.top,.fixed-save,.no-print{display:none!important}.main{margin:0;padding:0;width:100%}.panel{border:0;padding:0}.report{border:0;padding:0}.report table{min-width:0} @page{size:A4 portrait;margin:12mm}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><strong>EM DR. CUSTÓDIO DE PAULA RODRIGUES</strong><small>Gestão Escolar · Abre Campo/MG</small></div>
 <nav class="nav" id="nav"></nav>
</aside>
<main class="main">
 <div class="top"><div><h1 id="pageTitle">Início</h1><p id="pageDesc">Painel de gestão escolar</p></div><div class="year-tag" id="yearTag"></div></div>
 <div id="content"></div>
</main>
</div>
<div class="fixed-save"><button id="saveBtn">SALVAR</button></div>
<div class="loading" id="loading"><span class="spinner"></span> Salvando informações...</div>
<script>
(()=>{
'use strict';
const KEY='em_custodio_gestao_v1';
const defaultData={year:new Date().getFullYear(),years:[new Date().getFullYear()],classes:[],students:[],subjects:['Língua Portuguesa','Arte','Educação Física','Língua Inglesa','Matemática','Ciências','Geografia','História','Ensino Religioso'],schedule:[],calendar:{},attendance:{},activities:[],grades:{},stageRecovery:{},annualRecovery:{},settings:{approval:60,recovery:60,passingStatus:'APROVADO',failureStatus:'EM RECUPERAÇÃO',attendanceLimit:null},observations:{}};
let db=load(),page='Início';
const pages=['Início','Turmas','Alunos','Horário Escolar','Frequência','Notas','Resultados da Etapa','Boletins','Configurações'];
const icons=['⌂','▦','♙','◷','✓','▤','▥','▧','⚙'];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?{...structuredClone(defaultData),...x}:structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function cls(id){return db.classes.find(x=>x.id===id)}
function studentsIn(classId,year=db.year){return db.students.filter(s=>s.classId===classId&&s.year===Number(year)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'))}
function activeStudents(classId){return studentsIn(classId).filter(s=>s.status==='ATIVO')}
function classOptions(selected=''){return '<option value="">Selecione</option>'+db.classes.filter(c=>c.year===Number(db.year)).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)} · ${esc(c.shift)}</option>`).join('')}
function subjectOptions(selected=''){return db.subjects.map(s=>`<option ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}
function field(label,html){return `<div class="field"><label>${label}</label>${html}</div>`}
function select(name,options,value='',extra=''){return `<select id="${name}" ${extra}>${options}</select>`}
function input(name,type='text',value='',extra=''){return `<input id="${name}" type="${type}" value="${esc(value)}" ${extra}>`}
function toolbar(parts){return `<div class="toolbar">${parts}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="'+headers.length+'" class="empty">Nenhum registro encontrado.</td></tr>'}</tbody></table></div>`}
function stageName(n){return n+'º Bimestre'}
function monthKey(year,month,stage){return `${year}-${String(month).padStart(2,'0')}-${stage}`}
function dateKey(date,stage){return `${date}|${stage}`}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}
function weekday(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long'})}
function datesInMonth(year,month){let out=[],last=new Date(year,month,0).getDate();for(let d=1;d<=last;d++)out.push(`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`);return out}
function num(v){if(v===null||v===undefined||v==='')return null;let n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function cleanScore(v,max){let n=num(v);if(n===null)return null;if(n<0||n>max||!/^\d+(?:[.,]\d)?$/.test(String(v).trim()))return null;return Math.round(n*10)/10}
function roundScore(v){if(v===null)return 0;let n=Math.round(v*10)/10,base=Math.floor(n),d=Math.round((n-base)*10);if(d<=2)return base;if(d<=7)return base+.5;return base+1}
function scoreText(v){return v===null||v===undefined?'':Number(v).toFixed(1).replace(/\\.0$/,'')}
function gradeKey(student,stage,subject){return `${student}|${stage}|${subject}`}
function getGrade(student,stage,subject){return db.grades[gradeKey(student,stage,subject)]||{}}
function activitiesFor(classId,stage,subject){return db.activities.filter(a=>a.classId===classId&&a.stage===Number(stage)&&a.subject===subject)}
function activityScore(student,a){let g=getGrade(student,a.stage,a.subject),r=g.activities?.[a.id]||{};let original=r.score===undefined||r.score===''?null:cleanScore(r.score,a.max);let rec=r.recovery===undefined||r.recovery===''?null:cleanScore(r.recovery,a.max);let min=a.max*db.settings.recovery/100;let considered=original===null?0:original;if(original!==null&&original<min&&rec!==null)considered=rec>=min?min:Math.max(original,rec);return {original,recovery:rec,considered,enabled:original!==null&&original<min}}
function activityTotal(student,classId,stage,subject){let acts=activitiesFor(classId,stage,subject);return acts.reduce((s,a)=>s+activityScore(student,a).considered,0)}
function originalTotal(student,classId,stage,subject){return activitiesFor(classId,stage,subject).reduce((s,a)=>s+(activityScore(student,a).original||0),0)}
function disciplineAbsences(student,classId,stage,subject){let total=0;Object.entries(db.attendance).forEach(([k,rec])=>{let [date,st,cid]=k.split('|');if(Number(st)!==Number(stage)||cid!==classId||!rec[student])return;if(rec[student].present===false){let lessons=db.schedule.filter(x=>x.classId===classId&&x.day===weekday(date).toLowerCase()&&x.year===Number(db.year));total+=lessons.filter(x=>x.subject===subject).length}});return total}
function totalDailyAbsences(student,stage,classId){let n=0;Object.entries(db.attendance).forEach(([k,r])=>{let [date,st,cid]=k.split('|');if(Number(st)===Number(stage)&&cid===classId&&r[student]?.present===false)n++});return n}
function bimestreData(student,classId,stage,subject){let key=gradeKey(student,stage,subject),g=db.grades[key]||{},raw=g.custom!==undefined&&g.custom!==''?num(g.custom):activityTotal(student,classId,stage,subject);raw=raw===null?0:Math.min(25,Math.max(0,raw));let rec=g.stageRecovery===''||g.stageRecovery===undefined?null:cleanScore(g.stageRecovery,25),min=25*db.settings.recovery/100,final=raw;if(raw<min&&rec!==null)final=rec>=min?min:Math.max(raw,rec);return {raw,rec,final:roundScore(final),abs:disciplineAbsences(student,classId,stage,subject),needs:raw<min}}
function annualResult(student,classId,subject){let stages=[1,2,3,4].map(s=>bimestreData(student,classId,s,subject));let total=stages.reduce((a,b)=>a+b.final,0);let rec=db.annualRecovery[`${student}|${subject}`];let recovery=rec===''||rec===undefined?null:cleanScore(rec,100);let min=100*db.settings.recovery/100,final=total;if(total<db.settings.approval&&recovery!==null)final=recovery>=min?min:Math.max(total,recovery);return {stages,total,final:roundScore(final),recovery,needs:total<db.settings.approval}}
function show(msg,type='good'){let el=document.createElement('div');el.className='notice '+type;el.textContent=msg;document.getElementById('content').prepend(el);setTimeout(()=>el.remove(),4500)}
function go(p){page=p;render()}
function render(){document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button class="${page===p?'active':''}" data-page="${p}"><span class="ico">${icons[i]}</span>${p}</button>`).join('');document.getElementById('pageTitle').textContent=page;document.getElementById('pageDesc').textContent=({ 'Início':'Visão geral e acesso aos módulos','Turmas':'Cadastro e organização das turmas','Alunos':'Cadastro e situação dos estudantes','Horário Escolar':'Organização das aulas por turma','Frequência':'Calendário letivo e lançamento de presença','Notas':'Avaliações e lançamento de notas','Resultados da Etapa':'Fechamento bimestral e recuperação','Boletins':'Emissão do boletim escolar','Configurações':'Ano letivo, disciplinas, regras e backup'})[page];document.getElementById('yearTag').textContent='Ano letivo: '+db.year;document.getElementById('content').innerHTML=views[page]();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));bind()}
const views={
'Início':()=>`<section class="panel"><h2>Painel da instituição</h2><div class="statgrid"><div class="stat"><span>Turmas no ano letivo</span><b>${db.classes.filter(c=>c.year===Number(db.year)).length}</b></div><div class="stat"><span>Estudantes ativos</span><b>${db.students.filter(s=>s.year===Number(db.year)&&s.status==='ATIVO').length}</b></div><div class="stat"><span>Disciplinas cadastradas</span><b>${db.subjects.length}</b></div></div><div class="notice">Os dados são armazenados localmente neste navegador. Faça backups JSON regularmente para evitar perda de informações.</div></section><section class="panel"><h2>Acesso rápido</h2><div class="actions">${pages.slice(1).map(p=>`<button class="secondary" data-go="${p}">${p}</button>`).join('')}</div></section>`,
'Turmas':()=>`<section class="panel"><h2>Cadastro de turma</h2><input type="hidden" id="editClass"><div class="grid">${field('Nome da turma',input('className','text','','placeholder="Ex.: 701"'))}${field('Ano escolar',select('classGrade',['<option value="">Selecione</option>',...Array.from({length:9},(_,i)=>`<option>${i+1}º Ano</option>`)].join('')))}${field('Turno',select('classShift','<option value="">Selecione</option><option>Matutino</option><option>Vespertino</option><option>Noturno</option>'))}${field('Ano letivo',input('classYear','number',db.year))}</div><div class="actions" style="margin-top:14px"><button id="classSubmit">Cadastrar turma</button><button class="secondary" id="classClear">Limpar</button></div></section><section class="panel"><h2>Turmas cadastradas</h2>${table(['Turma','Ano escolar','Turno','Ano letivo','Ações'],db.classes.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.grade)}</td><td>${esc(c.shift)}</td><td>${c.year}</td><td><div class="actions"><button class="small secondary" data-edit-class="${c.id}">Editar</button><button class="small danger" data-del-class="${c.id}">Excluir</button></div></td></tr>`).join(''))}</section>`,
'Alunos':()=>`<section class="panel"><h2>Cadastro de estudante</h2><input type="hidden" id="editStudent"><div class="grid">${field('Nome completo',input('studentName'))}${field('Matrícula',input('studentEnrollment'))}${field('Data de nascimento',input('studentBirth','date'))}${field('Turma',select('studentClass',classOptions()))}${field('Situação',select('studentStatus','<option>ATIVO</option><option>TRANSFERIDO</option>'))}${field('Ano letivo',input('studentYear','number',db.year))}</div><div class="actions" style="margin-top:14px"><button id="studentSubmit">Cadastrar estudante</button><button class="secondary" id="studentClear">Limpar</button></div></section><section class="panel"><h2>Estudantes em ordem alfabética</h2>${toolbar(field('Filtrar turma',select('filterStudents','<option value="">Todas as turmas</option>'+db.classes.filter(c=>c.year===Number(db.year)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''))))}<div id="studentTable"></div></section>`,
'Horário Escolar':()=>`<section class="panel"><h2>Cadastro de horário</h2><input type="hidden" id="editLesson"><div class="grid">${field('Turma',select('lessonClass',classOptions()))}${field('Dia da semana',select('lessonDay',['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira'].map(d=>`<option value="${d}">${d}</option>`).join('')))}${field('Número da aula',select('lessonNumber',[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}">${n}ª aula</option>`).join('')))}${field('Disciplina',select('lessonSubject',subjectOptions()))}</div><div class="actions" style="margin-top:14px"><button id="lessonSubmit">Adicionar aula</button><button class="secondary" id="lessonClear">Limpar</button></div></section><section class="panel"><h2>Horários cadastrados</h2>${table(['Turma','Dia','Aula','Disciplina','Ações'],db.schedule.filter(x=>x.year===Number(db.year)).sort((a,b)=>a.day.localeCompare(b.day)||a.number-b.number).map(x=>`<tr><td>${esc(cls(x.classId)?.name||'Turma removida')}</td><td>${esc(x.day)}</td><td>${x.number}ª</td><td>${esc(x.subject)}</td><td><button class="small secondary" data-edit-lesson="${x.id}">Editar</button> <button class="small danger" data-del-lesson="${x.id}">Excluir</button></td></tr>`).join(''))}</section>`,
'Frequência':()=>`<section class="panel"><h2>Configuração dos dias letivos</h2>${toolbar(field('Etapa',select('calStage',[1,2,3,4].map(s=>`<option value="${s}">${stageName(s)}</option>`).join('')))+field('Mês',select('calMonth',Array.from({length:12},(_,i)=>`<option value="${i+1}">${new Date(2020,i,1).toLocaleDateString('pt-BR',{month:'long'})}</option>`).join(''))))}<div id="calendarDays"></div></section><section class="panel"><h2>Lançamento de frequência</h2>${toolbar(field('Etapa',select('attStage',[1,2,3,4].map(s=>`<option value="${s}">${stageName(s)}</option>`).join('')))+field('Turma',select('attClass',classOptions()))+field('Forma de lançamento',select('attMode','<option value="month">MÊS</option><option value="day">DIA</option>'))+field('Mês',select('attMonth',Array.from({length:12},(_,i)=>`<option value="${i+1}">${new Date(2020,i,1).toLocaleDateString('pt-BR',{month:'long'})}</option>`).join('')))+field('Data',select('attDate','<option value="">Selecione o mês e turma</option>')))}<div id="attendanceArea"></div></section>`,
'Notas':()=>`<section class="panel"><h2>Criar atividade avaliativa</h2><div class="grid">${field('Nome da avaliação',input('activityName'))}${field('Turma',select('activityClass',classOptions()))}${field('Disciplina',select('activitySubject',subjectOptions()))}${field('Etapa',select('activityStage',[1,2,3,4].map(s=>`<option value="${s}">${stageName(s)}</option>`).join('')))}${field('Valor máximo',input('activityMax','number','10','min="0.1" max="25" step="0.1"'))}</div><div class="actions" style="margin-top:14px"><button id="activitySubmit">Criar avaliação</button></div></section><section class="panel"><h2>Lançamento de notas</h2>${toolbar(field('Etapa',select('gradeStage',[1,2,3,4].map(s=>`<option value="${s}">${stageName(s)}</option>`).join('')))+field('Turma',select('gradeClass',classOptions()))+field('Disciplina',select('gradeSubject',subjectOptions())))}<div id="gradeTable"></div></section>`,
'Resultados da Etapa':()=>`<section class="panel"><h2>Resultados por bimestre</h2>${toolbar(field('Etapa',select('resultStage',[1,2,3,4].map(s=>`<option value="${s}">${stageName(s)}</option>`).join('')))+field('Turma',select('resultClass',classOptions()))+field('Disciplina',select('resultSubject',subjectOptions())))}<div id="resultTable"></div></section><section class="panel"><h2>Resultado anual e recuperação</h2><div id="annualTable"></div></section>`,
'Boletins':()=>`<section class="panel no-print"><h2>Selecionar boletim</h2>${toolbar(field('Turma',select('reportClass',classOptions()))+field('Estudante',select('reportStudent','<option value="">Selecione uma turma</option>')))}<div class="actions"><button id="makeReport">Gerar boletim</button><button class="secondary" id="printReport">Imprimir / Salvar PDF</button></div></section><div id="reportArea"></div>`,
'Configurações':()=>`<section class="panel"><h2>Configurações gerais</h2><div class="grid">${field('Ano letivo ativo',input('settingYear','number',db.year))}${field('Percentual mínimo para aprovação',input('settingApproval','number',db.settings.approval,'min="0" max="100" step="1"'))}${field('Percentual mínimo da recuperação',input('settingRecovery','number',db.settings.recovery,'min="0" max="100" step="1"'))}${field('Situação de aprovação',input('settingPass','text',db.settings.passingStatus))}${field('Situação de recuperação',input('settingFail','text',db.settings.failureStatus))}</div><div class="actions" style="margin-top:14px"><button id="saveSettings">Salvar configurações</button></div></section><section class="panel"><h2>Gerenciar disciplinas</h2>${field('Nova disciplina',input('newSubject'))}<div class="actions" style="margin-top:10px"><button id="addSubject">Adicionar disciplina</button></div><div style="margin-top:12px">${db.subjects.map(s=>`<div class="inline" style="padding:7px;border-bottom:1px solid var(--line)"><span style="flex:1">${esc(s)}</span><button class="small danger" data-del-subject="${esc(s)}">Excluir</button></div>`).join('')}</div></section><section class="panel"><h2>Backup e restauração</h2><p class="muted">O LocalStorage mantém os dados somente neste navegador e dispositivo. Não há sincronização automática entre aparelhos. Exporte backups regularmente.</p><div class="actions"><button id="exportBackup">Exportar backup JSON</button><button class="secondary" id="importButton">Importar backup JSON</button><input id="importFile" type="file" accept="application/json" class="hidden"></div></section>`
};
function bind(){
 const on=(id,fn)=>{let e=document.getElementById(id);if(e)e.addEventListener('click',fn)};
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 if(page==='Turmas'){
 on('classSubmit',()=>{let name=document.getElementById('className').value.trim(),grade=document.getElementById('classGrade').value,shift=document.getElementById('classShift').value,year=Number(document.getElementById('classYear').value),edit=document.getElementById('editClass').value;if(!name||!grade||!shift||!year)return show('Preencha todos os campos da turma.','warn');if(db.classes.some(c=>c.id!==edit&&c.name.toLowerCase()===name.toLowerCase()&&c.year===year))return show('Já existe uma turma com esse nome neste ano.','warn');if(edit)Object.assign(cls(edit),{name,grade,shift,year});else db.classes.push({id:id(),name,grade,shift,year});persist();render()});
 on('classClear',()=>render());
 document.querySelectorAll('[data-edit-class]').forEach(b=>b.onclick=()=>{let c=cls(b.dataset.editClass);document.getElementById('editClass').value=c.id;document.getElementById('className').value=c.name;document.getElementById('classGrade').value=c.grade;document.getElementById('classShift').value=c.shift;document.getElementById('classYear').value=c.year;document.getElementById('classSubmit').textContent='Salvar alterações'});
 document.querySelectorAll('[data-del-class]').forEach(b=>b.onclick=()=>{if(confirm('Excluir esta turma? Os estudantes e lançamentos vinculados serão preservados, mas ficarão sem turma.')){db.classes=db.classes.filter(c=>c.id!==b.dataset.delClass);persist();render()}});
 }
 if(page==='Alunos'){
 const draw=()=>{let f=document.getElementById('filterStudents')?.value||'',list=db.students.filter(s=>s.year===Number(db.year)&&(!f||s.classId===f)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));document.getElementById('studentTable').innerHTML=table(['Ordem','Estudante','Matrícula','Nascimento','Turma','Situação','Ações'],list.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.enrollment)}</td><td>${s.birth?fmtDate(s.birth):'—'}</td><td>${esc(cls(s.classId)?.name||'—')}</td><td><span class="pill">${s.status}</span></td><td><button class="small secondary" data-edit-student="${s.id}">Editar</button> <button class="small danger" data-del-student="${s.id}">Excluir</button></td></tr>`).join(''));document.querySelectorAll('[data-edit-student]').forEach(b=>b.onclick=()=>{let s=db.students.find(x=>x.id===b.dataset.editStudent);document.getElementById('editStudent').value=s.id;document.getElementById('studentName').value=s.name;document.getElementById('studentEnrollment').value=s.enrollment;document.getElementById('studentBirth').value=s.birth;document.getElementById('studentClass').value=s.classId;document.getElementById('studentStatus').value=s.status;document.getElementById('studentYear').value=s.year;document.getElementById('studentSubmit').textContent='Salvar alterações'});document.querySelectorAll('[data-del-student]').forEach(b=>b.onclick=()=>{if(confirm('Excluir estudante e seus dados relacionados?')){let sid=b.dataset.delStudent;db.students=db.students.filter(s=>s.id!==sid);Object.keys(db.grades).filter(k=>k.startsWith(sid+'|')).forEach(k=>delete db.grades[k]);Object.keys(db.attendance).forEach(k=>delete db.attendance[k][sid]);persist();draw()}})};
 on('studentSubmit',()=>{let name=document.getElementById('studentName').value.trim(),enrollment=document.getElementById('studentEnrollment').value.trim(),birth=document.getElementById('studentBirth').value,classId=document.getElementById('studentClass').value,status=document.getElementById('studentStatus').value,year=Number(document.getElementById('studentYear').value),edit=document.getElementById('editStudent').value;if(!name||!classId||!year)return show('Informe nome, turma e ano letivo.','warn');if(db.students.some(s=>s.id!==edit&&s.enrollment&&enrollment&&s.enrollment===enrollment&&s.year===year))return show('Matrícula já cadastrada neste ano.','warn');let obj={name,enrollment,birth,classId,status,year};if(edit)Object.assign(db.students.find(s=>s.id===edit),obj);else db.students.push({id:id(),...obj});persist();render()});on('studentClear',()=>render());document.getElementById('filterStudents').onchange=draw;draw();
 }
 if(page==='Horário Escolar'){
 on('lessonSubmit',()=>{let classId=document.getElementById('lessonClass').value,day=document.getElementById('lessonDay').value,number=Number(document.getElementById('lessonNumber').value),subject=document.getElementById('lessonSubject').value,edit=document.getElementById('editLesson').value;if(!classId)return show('Selecione uma turma.','warn');if(db.schedule.some(x=>x.id!==edit&&x.classId===classId&&x.day===day&&x.number===number&&x.year===Number(db.year)))return show('Já existe uma disciplina cadastrada para essa aula.','warn');let o={classId,day,number,subject,year:Number(db.year)};if(edit)Object.assign(db.schedule.find(x=>x.id===edit),o);else db.schedule.push({id:id(),...o});persist();render()});on('lessonClear',()=>render());document.querySelectorAll('[data-edit-lesson]').forEach(b=>b.onclick=()=>{let x=db.schedule.find(y=>y.id===b.dataset.editLesson);document.getElementById('editLesson').value=x.id;['classId','day','number','subject'].forEach(k=>document.getElementById('lesson'+k[0].toUpperCase()+k.slice(1)).value=x[k]);document.getElementById('lessonSubmit').textContent='Salvar alterações'});document.querySelectorAll('[data-del-lesson]').forEach(b=>b.onclick=()=>{db.schedule=db.schedule.filter(x=>x.id!==b.dataset.delLesson);persist();render()});
 }
 if(page==='Frequência'){
 const drawCal=()=>{let st=+document.getElementById('calStage').value,m=+document.getElementById('calMonth').value,days=datesInMonth(db.year,m);document.getElementById('calendarDays').innerHTML=days.map(d=>{let k=dateKey(d,st),checked=!!db.calendar[k];return `<div class="dayrow"><span class="date">${fmtDate(d)}</span><span class="weekday">${weekday(d)}</span><label><input type="checkbox" class="check" data-calendar="${d}" ${checked?'checked':''}> Habilitar aula</label></div>`}).join('');document.querySelectorAll('[data-calendar]').forEach(c=>c.onchange=()=>{let k=dateKey(c.dataset.calendar,st);if(c.checked)db.calendar[k]=true;else delete db.calendar[k];persist();drawAtt()})};
 const drawAtt=()=>{let st=+document.getElementById('attStage').value,cid=document.getElementById('attClass').value,mode=document.getElementById('attMode').value,m=+document.getElementById('attMonth').value,dates=datesInMonth(db.year,m).filter(d=>db.calendar[dateKey(d,st)]);let dateSel=document.getElementById('attDate'),prev=dateSel.value;dateSel.innerHTML='<option value="">Selecione</option>'+dates.map(d=>`<option value="${d}">${fmtDate(d)} · ${weekday(d)}</option>`).join('');if(dates.includes(prev))dateSel.value=prev;dateSel.disabled=mode==='month';let chosen=mode==='day'?(dateSel.value?[dateSel.value]:[]):dates;if(!cid){document.getElementById('attendanceArea').innerHTML='<p class="muted">Selecione uma turma.</p>';return}let list=activeStudents(cid);document.getElementById('attendanceArea').innerHTML=chosen.length?chosen.map(d=>{let k=`${d}|${st}|${cid}`,rec=db.attendance[k]||{};return `<h3 style="font-size:14px;margin:16px 0 8px">${fmtDate(d)} · ${weekday(d)}</h3>${table(['Ordem','Estudante','Compareceu','Faltou no dia'],list.map((s,i)=>{let present=rec[s.id]?.present!==false;return `<tr><td>${i+1}</td><td>${esc(s.name)}<span class="subline">Total de Faltas Diárias na Etapa: ${totalDailyAbsences(s.id,st,cid)}</span></td><td class="center"><input class="check att-check" type="checkbox" data-att="${k}" data-student="${s.id}" ${present?'checked':''}></td><td class="center">${present?'—':'<span class="pill">Faltou</span>'}</td></tr>`}).join(''))}`}).join(''):'<div class="empty">Não há dias habilitados neste mês ou nenhuma data foi selecionada.</div>';document.querySelectorAll('.att-check').forEach(c=>c.onchange=()=>{let k=c.dataset.att,sid=c.dataset.student;db.attendance[k]??={};db.attendance[k][sid]={present:c.checked};persist();drawAtt()})};
 ['calStage','calMonth'].forEach(x=>document.getElementById(x).onchange=drawCal);['attStage','attClass','attMode','attMonth','attDate'].forEach(x=>document.getElementById(x).onchange=drawAtt);drawCal();drawAtt();
 }
 if(page==='Notas'){
 on('activitySubmit',()=>{let name=document.getElementById('activityName').value.trim(),classId=document.getElementById('activityClass').value,subject=document.getElementById('activitySubject').value,stage=+document.getElementById('activityStage').value,max=num(document.getElementById('activityMax').value);if(!name||!classId||!max||max<=0||max>25)return show('Preencha os campos e informe valor máximo entre 0,1 e 25.','warn');db.activities.push({id:id(),name,classId,subject,stage,max,year:Number(db.year)});persist();render()});const draw=()=>{let st=+document.getElementById('gradeStage').value,cid=document.getElementById('gradeClass').value,sub=document.getElementById('gradeSubject').value,acts=activitiesFor(cid,st,sub),list=activeStudents(cid);document.getElementById('gradeTable').innerHTML=!cid?'<p class="muted">Selecione uma turma.</p>':table(['Ordem','Estudante','Atividades Avaliativas Criadas','Nota Original','Nota Personalizada','Nota Oficial'],list.map((s,i)=>{let g=getGrade(s.id,st,sub),activityHtml=acts.map(a=>{let r=g.activities?.[a.id]||{},sc=activityScore(s.id,a);return `<div class="activity"><strong>${esc(a.name)} <span class="muted">(${scoreText(a.max)} pts)</span></strong><label>Nota: <input type="text" inputmode="decimal" data-grade="${s.id}" data-act="${a.id}" data-kind="score" value="${esc(r.score??'')}" placeholder="0,0"></label><label>Nota da Recuperação: <input type="text" inputmode="decimal" data-grade="${s.id}" data-act="${a.id}" data-kind="recovery" value="${esc(r.recovery??'')}" ${sc.enabled?'':'disabled'}></label><label><input type="checkbox" class="check" data-grade="${s.id}" data-act="${a.id}" data-kind="attended" ${r.attended===false?'':'checked'}> Compareceu</label><div class="subline">Considerada: ${scoreText(sc.considered)}</div></div>`}).join('')||'<span class="muted">Nenhuma avaliação criada.</span>';let raw=originalTotal(s.id,cid,st,sub),custom=g.custom??'',official=roundScore(custom!==''?Math.min(25,Math.max(0,num(custom)||0)):activityTotal(s.id,cid,st,sub));return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${activityHtml}</td><td class="center">${scoreText(roundScore(raw))}</td><td><input class="cell custom-grade" data-student="${s.id}" value="${esc(custom)}" placeholder="Opcional" inputmode="decimal"></td><td><div class="official"><span>NOTA OFICIAL</span><b>${scoreText(official)}</b></div></td></tr>`}).join(''));document.querySelectorAll('[data-grade]').forEach(e=>e.onchange=()=>{let sid=e.dataset.grade,st=+document.getElementById('gradeStage').value,sub=document.getElementById('gradeSubject').value,a=e.dataset.act,k=gradeKey(sid,st,sub);db.grades[k]??={activities:{}};db.grades[k].activities??={};db.grades[k].activities[a]??={};if(e.dataset.kind==='attended')db.grades[k].activities[a].attended=e.checked;else{let act=db.activities.find(x=>x.id===a),v=e.value.trim();if(v!==''&&cleanScore(v,act.max)===null){show('Nota inválida. Use no máximo uma casa decimal e respeite o valor máximo.','warn');e.value='';return}db.grades[k].activities[a][e.dataset.kind]=v===''?'':String(cleanScore(v,act.max));}persist();draw()});document.querySelectorAll('.custom-grade').forEach(e=>e.onchange=()=>{let v=e.value.trim(),sid=e.dataset.student,k=gradeKey(sid,+document.getElementById('gradeStage').value,document.getElementById('gradeSubject').value);if(v!==''&&cleanScore(v,25)===null){show('Nota personalizada deve estar entre 0 e 25, com uma casa decimal.','warn');e.value='';return}db.grades[k]??={};db.grades[k].custom=v===''?'':String(cleanScore(v,25));persist();draw()})};['gradeStage','gradeClass','gradeSubject'].forEach(x=>document.getElementById(x).onchange=draw);draw();
 }
 if(page==='Resultados da Etapa'){
 const draw=()=>{let st=+document.getElementById('resultStage').value,cid=document.getElementById('resultClass').value,sub=document.getElementById('resultSubject').value,list=activeStudents(cid);document.getElementById('resultTable').innerHTML=!cid?'<p class="muted">Selecione uma turma.</p>':table(['Ordem','Estudante','Bimestres','Resultado Final'],list.map((s,i)=>{let d=bimestreData(s.id,cid,st,sub),k=gradeKey(s.id,st,sub),g=db.grades[k]||{};return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td><div class="activity"><strong>${stageName(st)}</strong><label>Nota das Avaliações: <input class="cell" disabled value="${scoreText(d.raw)}"></label><label>Nota da Recuperação: <input class="cell stage-rec" data-sid="${s.id}" value="${esc(g.stageRecovery??'')}" ${d.needs?'':'disabled'} placeholder="—"></label><label>Faltas: <input class="cell" disabled value="${d.abs}"></label><strong>Nota Final da Etapa: ${scoreText(d.final)}</strong></div></td><td><strong>${scoreText(annualResult(s.id,cid,sub).total)}</strong></td></tr>`}).join(''));document.querySelectorAll('.stage-rec').forEach(e=>e.onchange=()=>{let v=e.value.trim(),k=gradeKey(e.dataset.sid,st,sub);if(v!==''&&cleanScore(v,25)===null){show('Recuperação deve estar entre 0 e 25.','warn');e.value='';return}db.grades[k]??={};db.grades[k].stageRecovery=v===''?'':String(cleanScore(v,25));persist();draw()});document.getElementById('annualTable').innerHTML=!cid?'<p class="muted">Selecione uma turma.</p>':table(['Ordem','Estudante','Total das etapas','Recuperação anual','Resultado final'],list.map((s,i)=>{let a=annualResult(s.id,cid,sub),k=`${s.id}|${sub}`,v=db.annualRecovery[k]??'';return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${scoreText(a.total)}</td><td><input class="cell annual-rec" data-sid="${s.id}" value="${esc(v)}" ${a.needs?'':'disabled'} placeholder="—"></td><td><strong>${scoreText(a.final)}</strong></td></tr>`}).join(''));document.querySelectorAll('.annual-rec').forEach(e=>e.onchange=()=>{let v=e.value.trim(),k=`${e.dataset.sid}|${sub}`;if(v!==''&&cleanScore(v,100)===null){show('Recuperação anual deve estar entre 0 e 100.','warn');e.value='';return}db.annualRecovery[k]=v===''?'':String(cleanScore(v,100));persist();draw()})};['resultStage','resultClass','resultSubject'].forEach(x=>document.getElementById(x).onchange=draw);draw();
 }
 if(page==='Boletins'){
 const updateStudents=()=>{let cid=document.getElementById('reportClass').value;document.getElementById('reportStudent').innerHTML='<option value="">Selecione</option>'+activeStudents(cid).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')};document.getElementById('reportClass').onchange=updateStudents;on('makeReport',()=>{let cid=document.getElementById('reportClass').value,sid=document.getElementById('reportStudent').value,s=db.students.find(x=>x.id===sid),c=cls(cid);if(!s||!c)return show('Selecione a turma e o estudante.','warn');let rows=db.subjects.map(sub=>{let stages=[1,2,3,4].map(st=>bimestreData(s.id,cid,st,sub)),annual=annualResult(s.id,cid,sub),abs=stages.reduce((a,x)=>a+x.abs,0),status=annual.final>=db.settings.approval?db.settings.passingStatus:(annual.needs?db.settings.failureStatus:'REPROVADO');return `<tr><td>${esc(sub)}</td>${stages.map(x=>`<td class="center">${scoreText(x.final)}</td><td class="center">${x.abs}</td>`).join('')}<td class="center">${abs}</td><td class="center">${scoreText(annual.final)}</td><td class="center">${status}</td></tr>`}).join('');document.getElementById('reportArea').innerHTML=`<div class="report"><h2>BOLETIM ESCOLAR – ANOS FINAIS</h2><div class="report-sub"><b>SECRETARIA MUNICIPAL DE EDUCAÇÃO – ABRE CAMPO/MG</b><br><b>EM DR. CUSTÓDIO DE PAULA RODRIGUES</b><br>POVOADO DA APARECIDA, S/N, ABRE CAMPO, MINAS GERAIS.</div><hr><p><b>Estudante:</b> ${esc(s.name)} &nbsp; <b>Ano letivo:</b> ${s.year}</p><p><b>Ensino:</b> Fundamental &nbsp; <b>Turno:</b> ${esc(c.shift)} &nbsp; <b>Turma:</b> ${esc(c.name)} &nbsp; <b>Ano escolar:</b> ${esc(c.grade)}</p><table><thead><tr><th rowspan="2">Disciplina</th><th colspan="2">1º Bimestre</th><th colspan="2">2º Bimestre</th><th colspan="2">3º Bimestre</th><th colspan="2">4º Bimestre</th><th rowspan="2">Total faltas</th><th rowspan="2">Conceito final</th><th rowspan="2">Situação</th></tr><tr>${[1,2,3,4].map(()=>'<th>Nota</th><th>Faltas</th>').join('')}</tr></thead><tbody>${rows}</tbody></table><p style="margin-top:16px"><b>Observações:</b> ${esc(db.observations[s.id]||'')}</p><div class="signatures"><div>Assinatura do(a) responsável</div><div>Assinatura da direção / secretaria</div></div></div>`});on('printReport',()=>{if(!document.getElementById('reportArea').innerHTML)return show('Gere um boletim antes de imprimir.','warn');window.print()});
 }
 if(page==='Configurações'){
 on('saveSettings',()=>{let y=Number(document.getElementById('settingYear').value),a=num(document.getElementById('settingApproval').value),r=num(document.getElementById('settingRecovery').value);if(!y||a===null||r===null||a<0||a>100||r<0||r>100)return show('Verifique ano e percentuais (0 a 100).','warn');db.year=y;db.years=[...new Set([...db.years,y])];db.settings={...db.settings,approval:a,recovery:r,passingStatus:document.getElementById('settingPass').value.trim()||'APROVADO',failureStatus:document.getElementById('settingFail').value.trim()||'EM RECUPERAÇÃO'};persist();render()});on('addSubject',()=>{let v=document.getElementById('newSubject').value.trim();if(!v)return;if(db.subjects.some(s=>s.toLowerCase()===v.toLowerCase()))return show('Disciplina já cadastrada.','warn');db.subjects.push(v);persist();render()});document.querySelectorAll('[data-del-subject]').forEach(b=>b.onclick=()=>{if(confirm('Excluir a disciplina?')){db.subjects=db.subjects.filter(s=>s!==b.dataset.delSubject);persist();render()}});on('exportBackup',()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`backup_gestao_escolar_${db.year}.json`;a.click();URL.revokeObjectURL(url)});on('importButton',()=>document.getElementById('importFile').click());document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.classes)||!Array.isArray(obj.students)||!Array.isArray(obj.subjects))throw Error();if(confirm('A importação substituirá os dados atuais. Continuar?')){db={...structuredClone(defaultData),...obj};persist();render();show('Backup importado com sucesso.')}}catch(err){show('Arquivo JSON inválido ou incompatível.','warn')}};
 }
}
document.getElementById('saveBtn').onclick=()=>{let l=document.getElementById('loading');l.style.display='flex';setTimeout(()=>{try{persist();l.style.display='none';page='Início';render();show('Dados salvos com sucesso neste dispositivo.')}catch(e){l.style.display='none';show('Não foi possível salvar. O armazenamento pode estar cheio.','warn')}},350)};
render();
})();
</script>
